# IslandNpc Language File - English
# Plugin messages and text displayed to players

# Message prefix
prefix: "&8[&6IslandNPC&8]&r "

# Command messages
npc-hidden: "&aIsland NPC has been hidden!"
npc-shown: "&aIsland NPC is now visible!"
npc-toggled-hidden: "&aIsland NPC toggled to hidden!"
npc-toggled-visible: "&aIsland NPC toggled to visible!"
npc-moved: "&aIsland NPC has been moved to your location!"
npc-created: "&aIsland NPC has been created!"
npc-deleted: "&aIsland NPC has been deleted!"
npc-already-hidden: "&eYour island NPC is already hidden!"
npc-already-visible: "&eYour island NPC is already visible!"
npc-not-found: "&cNPC not found for your island!"
npc-create-failed: "&cFailed to create island NPC!"

# Error messages
no-island: "&cYou don't have an island!"
no-permission: "&cYou don't have permission to use this command."
players-only: "&cThis command can only be used by players."
unknown-command: "&cUnknown subcommand. Use /islandnpc help for help"
provider-not-initialized: "&cNPC provider not initialized, please contact an administrator"
